<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zork</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #terminal { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      theme: {
        background: '#000000',
        foreground: '#00ff00',
        cursor: '#00ff00',
        cursorAccent: '#000000',
        selectionBackground: '#00aa00',
      },
      fontFamily: 'monospace',
      fontSize: 16,
      scrollback: 5000,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    window.addEventListener('resize', () => fitAddon.fit());

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => { term.focus(); };

    ws.onmessage = (event) => {
      // Convert \n to \r\n for xterm
      term.write(event.data.replace(/\n/g, '\r\n'));
    };

    ws.onclose = () => {
      term.write('\r\n\r\n[Connection closed]\r\n');
    };

    ws.onerror = () => {
      term.write('\r\n\r\n[Connection error]\r\n');
    };

    let inputBuffer = '';

    term.onKey(({ key, domEvent }) => {
      const code = domEvent.keyCode;

      if (ws.readyState !== WebSocket.OPEN) return;

      if (code === 13) {
        // Enter — send line, echo newline
        ws.send(inputBuffer);
        term.write('\r\n');
        inputBuffer = '';
      } else if (code === 8) {
        // Backspace
        if (inputBuffer.length > 0) {
          inputBuffer = inputBuffer.slice(0, -1);
          term.write('\b \b');
        }
      } else if (key.length === 1 && !domEvent.ctrlKey && !domEvent.altKey && !domEvent.metaKey) {
        // Printable character
        inputBuffer += key;
        term.write(key);
      }
    });
  </script>
</body>
</html>
