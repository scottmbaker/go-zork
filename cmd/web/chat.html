<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zork</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 15px;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    #header {
      padding: 10px 16px;
      background: #0d0d0d;
      border-bottom: 1px solid #333;
      font-size: 18px;
      font-weight: bold;
      color: #00cc66;
      letter-spacing: 2px;
    }

    #header a {
      color: #888;
      font-size: 13px;
      font-weight: normal;
      text-decoration: none;
      margin-left: 16px;
      letter-spacing: 0;
    }

    #header a:hover { color: #00cc66; }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    #input-row {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #0d0d0d;
      border-top: 1px solid #333;
    }

    #input-box {
      flex: 1;
      background: #111;
      border: 1px solid #444;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 15px;
      padding: 8px 12px;
      border-radius: 4px;
      outline: none;
    }

    #input-box:focus { border-color: #00cc66; }

    #send-btn {
      background: #005533;
      color: #00cc66;
      border: 1px solid #007744;
      font-family: monospace;
      font-size: 15px;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
    }

    #send-btn:hover { background: #006644; }
    #send-btn:disabled { opacity: 0.4; cursor: default; }

    #status {
      font-size: 12px;
      color: #666;
      padding: 4px 16px 4px;
      background: #0d0d0d;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      ZORK
      <a href="/terminal">Terminal UI</a>
    </div>
    <div id="output"></div>
    <div id="status">Connecting…</div>
    <div id="input-row">
      <input id="input-box" type="text" placeholder="Enter command…" autocomplete="off" spellcheck="false" disabled />
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>

  <script>
    const output  = document.getElementById('output');
    const inputBox = document.getElementById('input-box');
    const sendBtn  = document.getElementById('send-btn');
    const status   = document.getElementById('status');

    function appendOutput(text) {
      output.textContent += text;
      output.scrollTop = output.scrollHeight;
    }

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      status.textContent = 'Connected';
      inputBox.disabled = false;
      sendBtn.disabled = false;
      inputBox.focus();
    };

    ws.onmessage = (event) => {
      appendOutput(event.data);
    };

    ws.onclose = () => {
      status.textContent = 'Disconnected';
      inputBox.disabled = true;
      sendBtn.disabled = true;
      appendOutput('\n\n[Connection closed]\n');
    };

    ws.onerror = () => {
      status.textContent = 'Error';
      appendOutput('\n\n[Connection error]\n');
    };

    function sendInput() {
      const line = inputBox.value;
      if (ws.readyState !== WebSocket.OPEN) return;
      ws.send(line);
      inputBox.value = '';
    }

    sendBtn.addEventListener('click', sendInput);

    inputBox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendInput();
      }
    });
  </script>
</body>
</html>
